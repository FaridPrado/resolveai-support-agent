name: Supabase Keep Alive

on:
  schedule:
    # Runs every Monday and Thursday at 12:17 UTC.
    # This is enough to avoid a 7-day inactivity window.
    - cron: "17 12 * * 1,4"
  workflow_dispatch:

jobs:
  ping-supabase:
    name: Ping Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Call Supabase keep_alive RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/keep_alive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'